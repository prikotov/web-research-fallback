name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl
      - name: Check PHP syntax
        run: |
          php -l WrfClient.php
          php -l scripts/fetch.php
          php -l scripts/search.php
          php -l tests/run.php
      - name: Run offline tests
        run: php tests/run.php
